<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self'"
    />
    <title>像素小農場</title>
    <meta name="description" content="種田、養吉娃娃和臘腸狗的像素放置農場" />
    <meta name="theme-color" content="#5a9e3a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="小農場" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Inline so the loading screen shows before the game's code has downloaded. -->
    <style>#loading{z-index:100;color:#3a2417;background:linear-gradient(#7cc6f2,#d6f1ff 70%,#9fd86b 70% 76%,#9a6a43 76%);flex-direction:column;justify-content:center;align-items:center;gap:14px;font:700 16px/1.4 Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif;transition:opacity .4s;display:flex;position:fixed;inset:0}#loading.done{opacity:0;pointer-events:none}#loading img{width:96px;height:96px;image-rendering:pixelated;border:3px solid #3a2417;animation:.6s ease-in-out infinite alternate hop}#loading .loading-title{letter-spacing:3px;color:#fff;text-shadow:2px 2px #3a2417,-2px 2px #3a2417,2px -2px #3a2417,-2px -2px #3a2417;font-size:26px}#loading .loading-bar{background:#3a2417;border:2px solid #fff4d6;width:min(220px,60vw);height:12px}#loading .loading-bar i{background:#8fd36a;width:8%;height:100%;animation:4s cubic-bezier(.2,.7,.3,1) forwards fill;display:block}#loading.done .loading-bar i{width:100%;transition:width .2s;animation:none}#loading.failed .loading-bar i{background:#e8505b;animation:none}#loading-tip{text-align:center;min-height:1.4em;padding:0 16px;font-size:13px}@keyframes hop{to{transform:translateY(-10px)}}@keyframes fill{to{width:85%}}</style>
    <script type="module" crossorigin src="./assets/index-B8JDRcOS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bt6cl6kR.css">
  </head>
  <body>
    <div id="loading">
      <img src="./icons/icon-192.png" alt="" />
      <div class="loading-title">像素小農場</div>
      <div class="loading-bar"><i></i></div>
      <div id="loading-tip">正在準備農場…</div>
    </div>
    <header id="topbar" class="solid">
      <button id="menu-btn" aria-label="農場選單"><img alt="" /></button>
      <div id="farm-title"></div>
      <button id="sky-info" aria-label="季節與天氣">
        <img id="season-icon" alt="" /><img id="weather-icon" alt="" hidden />
      </button>
      <div id="coins"><img id="coin-icon" alt="" /><b id="coin-count">0</b></div>
    </header>
    <div id="game"></div>
    <footer id="seedbar" class="solid">
      <div id="seed-row"></div>
      <div id="seed-caption"></div>
      <div id="visit-bar"></div>
    </footer>
    <div id="tooltip"></div>
    <div id="toast"></div>
    <div id="dog-card" class="solid"></div>
    <div id="panel-backdrop" class="solid"></div>
    <div id="panel" class="solid"></div>
    <div id="coach"></div>
    <div id="dialog" class="solid"></div>
  </body>
</html>
